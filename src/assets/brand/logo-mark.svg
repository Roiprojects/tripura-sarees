<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Tripura Sarees Icon">
  <defs>
    <linearGradient id="markGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2BE57"/>
      <stop offset="25%" stop-color="#C9A227"/>
      <stop offset="65%" stop-color="#E8CA6F"/>
      <stop offset="100%" stop-color="#9C7815"/>
    </linearGradient>
    <linearGradient id="bgEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#125847"/>
      <stop offset="100%" stop-color="#083026"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Circular luxury badge in site's Deep Emerald -->
  <circle cx="80" cy="80" r="76" fill="url(#bgEmerald)" stroke="#C9A227" stroke-width="1.5" filter="url(#markShadow)"/>

  <!-- Large Roman Serif T in Antique Gold -->
  <g fill="url(#markGold)" transform="translate(80, 74)">
    <path d="M -42 -36 C -42 -26, -36 -24, -28 -24 L -8 -24 L -8 40 C -16 40, -22 42, -22 49 L 22 49 C 22 42, 16 40, 8 40 L 8 -24 L 28 -24 C 36 -24, 42 -26, 42 -36 Z"/>
  </g>

  <!-- TRIPURA across the T in crisp warm ivory -->
  <text x="80" y="80" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#FAF7F2" letter-spacing="8">TRIPURA</text>

  <!-- SAREES subtitled in Gold -->
  <text x="83" y="96" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6.5" font-weight="600" fill="#E2BE57" letter-spacing="5">SAREES</text>
</svg>
